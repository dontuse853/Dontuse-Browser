name: Build rebranded Chromium

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # ====== EDIT THIS: the name shown in the Dock, menus, and Finder ======
  BROWSER_NAME: "Dontuse Browser"

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86-64]
    steps:
      - uses: actions/checkout@v4

      - name: Download latest ungoogled-chromium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          URL=$(gh api "repos/ungoogled-software/ungoogled-chromium-macos/releases?per_page=30" \
            --jq '[.[] | select(.draft == false) | .assets[] | select(.name | endswith("_${{ matrix.arch }}-macos.dmg"))][0].browser_download_url')
          echo "Downloading: $URL"
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No matching .dmg found in recent releases"
            exit 1
          fi
          curl -fL -o dl/chromium.dmg "$URL"
          ls -lh dl

      - name: Extract the app
        run: |
          mkdir -p "$PWD/mnt" work
          hdiutil attach dl/*.dmg -mountpoint "$PWD/mnt" -nobrowse -readonly -quiet
          cp -R mnt/*.app work/
          hdiutil detach "$PWD/mnt" -quiet
          ls work

      - name: Rebrand (name and optional icon)
        run: |
          cd work
          APP=$(ls -d *.app | head -1)
          PLIST="$APP/Contents/Info.plist"
          for key in CFBundleName CFBundleDisplayName; do
            /usr/libexec/PlistBuddy -c "Set :$key $BROWSER_NAME" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$key string $BROWSER_NAME" "$PLIST"
          done

          # Optional: put a 1024x1024 icon.png at the top of the repo to use as the app icon
          if [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            ICONSET="$(mktemp -d)/icon.iconset"
            mkdir -p "$ICONSET"
            for s in 16 32 128 256 512; do
              sips -z $s $s "$GITHUB_WORKSPACE/icon.png" --out "$ICONSET/icon_${s}x${s}.png"
              sips -z $((s*2)) $((s*2)) "$GITHUB_WORKSPACE/icon.png" --out "$ICONSET/icon_${s}x${s}@2x.png"
            done
            iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/app.icns"
          fi

          mv "$APP" "$BROWSER_NAME.app"

      - name: Sign locally (free, ad-hoc)
        run: |
          cd work
          codesign --force --deep --sign - "$BROWSER_NAME.app"

      - name: Package
        run: |
          cd work
          NAME="${BROWSER_NAME// /-}-${{ matrix.arch }}"
          ditto -c -k --keepParent "$BROWSER_NAME.app" "$GITHUB_WORKSPACE/$NAME.zip"
          hdiutil create -volname "$BROWSER_NAME" -srcfolder "$BROWSER_NAME.app" \
            -ov -format UDZO "$GITHUB_WORKSPACE/$NAME.dmg"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.dmg
            *.zip

      - name: Keep as downloadable build (manual runs)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: browser-${{ matrix.arch }}
          path: |
            *.dmg
            *.zip
