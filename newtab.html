<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>New Tab</title>
  <style>
    :root { --bg:#16181d; --bar:#22252c; --tab:#2c3039; --accent:#7c5cff; --text:#e8eaed; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px -apple-system, system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 14vh 20px 40px; text-align: center; }
    h1 { font-size: 34px; margin: 0 0 24px; letter-spacing: .5px; }
    h1 span { color: var(--accent); }
    form { margin-bottom: 36px; }
    input { width: 100%; height: 48px; border: 0; border-radius: 24px; padding: 0 22px; background: var(--bar); color: var(--text); font-size: 16px; outline: none; }
    input:focus { box-shadow: 0 0 0 2px var(--accent); }
    #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    a.tile { display: block; padding: 18px 10px; border-radius: 14px; background: var(--bar); color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.tile:hover { background: var(--tab); }
    a.tile b { display: grid; place-items: center; width: 40px; height: 40px; margin: 0 auto 8px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <h1 id="name"></h1>
    <form id="form"><input id="q" placeholder="Search or enter address" autofocus autocomplete="off" spellcheck="false" /></form>
    <div id="tiles"></div>
  </main>
  <script>
    (async () => {
      const cfg = await internal.config();
      for (const [k, v] of Object.entries(cfg.theme)) document.documentElement.style.setProperty("--" + k, v);
      document.getElementById("name").textContent = cfg.name;

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        internal.go(document.getElementById("q").value);
      });

      const tiles = document.getElementById("tiles");
      for (const b of await internal.bookmarks()) {
        if (!/^https?:\/\//i.test(b.url)) continue;
        const a = document.createElement("a");
        a.className = "tile";
        a.href = b.url;
        const dot = document.createElement("b");
        dot.textContent = (b.title || b.url).trim().charAt(0).toUpperCase();
        a.append(dot, document.createTextNode(b.title || b.url));
        tiles.append(a);
      }
    })();
  </script>
</body>
</html>
